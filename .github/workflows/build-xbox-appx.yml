name: Build Xbox AppX (UWP sideload)

on:
  workflow_dispatch: # manual trigger
    inputs:
      artifact_name:
        description: "Artifact name to upload"
        required: false
        default: jellyfinxbox-appx
        type: string
      run_audit:
        description: "Run package audit checks before uploading"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      artifact_name:
        description: "Artifact name to upload"
        required: false
        default: jellyfinxbox-appx
        type: string
      run_audit:
        description: "Run package audit checks before uploading"
        required: false
        default: false
        type: boolean
    secrets:
      CERT_PFX_B64:
        required: false
      CERT_PASSWORD:
        required: false
  push:
    branches: [main, master]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Set up MSBuild (VS 2022)
        uses: microsoft/setup-msbuild@v2

      # The hosted runner image only ships UWP VC/MSIX bits; the core UWP
      # workload (XAML compiler + appx packaging targets) is added on demand.
      - name: Ensure UWP workload
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installed = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.UWP.Support 2>$null
          $hasUwp = ($LASTEXITCODE -eq 0 -and $installed)
          if (-not $hasUwp) {
            Write-Host "UWP workload missing - installing (one-time, ~5 min)..."
            $vsPath = (& $vswhere -latest -products * -property installationPath).Trim()
            & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe" modify `
              --installPath $vsPath `
              --add Microsoft.VisualStudio.Component.UWP.Support `
              --quiet --norestart
            if ($LASTEXITCODE -ne 0) { throw "Failed to install UWP workload (exit $LASTEXITCODE)" }
          } else {
            Write-Host "UWP workload already present"
          }

      # AppX sideload packages must be code-signed. Default: generate an
      # ephemeral self-signed cert per run (re-trust the uploaded .cer on the
      # Xbox each time). For a stable cert across builds, set repository
      # secrets CERT_PFX_B64 (base64 of a .pfx) + CERT_PASSWORD; the matching
      # .cer then only needs to be trusted on your console once.
      - name: Prepare signing certificate
        shell: pwsh
        env:
          CERT_PFX_B64: ${{ secrets.CERT_PFX_B64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfx = Join-Path $env:RUNNER_TEMP "JellyfinXbox.pfx"
          if ($env:CERT_PFX_B64) {
            if (-not $env:CERT_PASSWORD) { throw "CERT_PASSWORD secret is required when CERT_PFX_B64 is set." }
            [System.IO.File]::WriteAllBytes($pfx, [System.Convert]::FromBase64String($env:CERT_PFX_B64))
            Write-Host "Using stable certificate from secrets"
          } else {
            if (-not $env:CERT_PASSWORD) { $env:CERT_PASSWORD = "JellyfinXbox-CI-Pass!" }
            # Subject matches the manifest Publisher (CN=AutoClaw) so the
            # package identity stays consistent; a stable cert from secrets
            # should also be issued with CN=AutoClaw.
            $cert = New-SelfSignedCertificate -Type CodeSigningCert `
              -Subject "CN=AutoClaw" -KeyExportPolicy Exportable `
              -KeySpec Signature -KeyUsage DigitalSignature `
              -CertStoreLocation "Cert:\CurrentUser\My"
            Export-PfxCertificate -Cert $cert -FilePath $pfx `
              -Password (ConvertTo-SecureString $env:CERT_PASSWORD -Force -AsPlainText) | Out-Null
            Export-Certificate -Cert $cert -FilePath (Join-Path $env:RUNNER_TEMP "JellyfinXbox.cer") | Out-Null
            Write-Host "Generated ephemeral self-signed certificate"
          }
          Write-Host "PFX=$pfx"

          # Import into the current user's personal store so the MSIX
          # packaging tasks can resolve the signing cert by thumbprint.
          # (Without this, packaging fails with APPX0105 "Cannot import
          # the key file" and no .appx is produced.)
          $securePass = ConvertTo-SecureString $env:CERT_PASSWORD -Force -AsPlainText
          $imported = @(Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $securePass)
          $certificate = $imported[0]
          Write-Host "Imported PFX thumbprint: $($certificate.Thumbprint)"
          Export-Certificate -Cert $certificate -FilePath (Join-Path $env:RUNNER_TEMP "JellyfinXbox.cer") | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "CERT_THUMBPRINT=$($certificate.Thumbprint)"

      - name: Restore packages
        shell: pwsh
        run: msbuild JellyfinXbox.sln -t:Restore -p:Configuration=Release -p:Platform=x64 -v:minimal

      - name: Run client tests
        shell: pwsh
        run: dotnet test JellyfinClient.Tests\JellyfinClient.Tests.csproj -c Release --no-restore --verbosity normal

      - name: Build and package AppX (sideload)
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:CERT_PASSWORD) { $env:CERT_PASSWORD = "JellyfinXbox-CI-Pass!" }
          # GenerateAppxPackageOnBuild is what actually triggers MSIX
          # packaging for UWP projects (used by Files, Bili.Copilot, PPSSPP
          # CI). -t:Build with AppxPackage=true alone only compiles.
          msbuild JellyfinXbox\JellyfinXbox.csproj -t:Build `
            -p:Configuration=Release `
            -p:Platform=x64 `
            -p:AppxPackage=true `
            -p:GenerateAppxPackageOnBuild=true `
            -p:UapAppxPackageBuildMode=Sideload `
            -p:AppxBundle=Never `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateThumbprint="$env:CERT_THUMBPRINT" `
            -p:AppxPackageDir="$env:RUNNER_TEMP/AppxPackages/" `
            -v:minimal

      - name: Collect outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "AppxOutput"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $pkg = Get-ChildItem -Path "$env:RUNNER_TEMP/AppxPackages", "$env:GITHUB_WORKSPACE" -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in ".appx",".appxbundle",".msix",".msixbundle" }
          $pkg | Copy-Item -Destination $out
          $cer = Join-Path $env:RUNNER_TEMP "JellyfinXbox.cer"
          if (Test-Path $cer) { Copy-Item $cer $out }
          Get-ChildItem $out | ForEach-Object { Write-Host ("{0}  {1} bytes" -f $_.Name, $_.Length) }
          if (-not $pkg) {
            Write-Host "=== bin tree ==="
            Get-ChildItem "$env:GITHUB_WORKSPACE\JellyfinXbox\bin" -Recurse -File -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host $_.FullName }
            Write-Host "=== temp AppxPackages tree ==="
            Get-ChildItem "$env:RUNNER_TEMP" -Recurse -File -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host $_.FullName }
            throw "FAILED: no appx package produced - see tree dumps above"
          }

      - name: Verify self-contained .NET runtime is packaged
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pkg = Get-ChildItem -Path "$env:RUNNER_TEMP/AppxPackages", "$env:GITHUB_WORKSPACE" -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in ".appx", ".appxbundle", ".msix", ".msixbundle" } |
            Select-Object -First 1
          if (-not $pkg) { throw "Cannot verify self-contained runtime: package not found." }

          $expanded = Join-Path $env:RUNNER_TEMP "expanded-package"
          if (Test-Path $expanded) { Remove-Item $expanded -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $expanded | Out-Null
          Expand-Archive -LiteralPath $pkg.FullName -DestinationPath $expanded -Force

          $runtimeNames = @("coreclr.dll", "hostfxr.dll", "System.Private.CoreLib.dll")
          $runtimeFiles = Get-ChildItem $expanded -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $runtimeNames -contains $_.Name }
          if (-not $runtimeFiles) {
            Write-Host "Package does not contain the expected self-contained .NET runtime files."
            Write-Host "Package: $($pkg.FullName)"
            Get-ChildItem $expanded -Recurse -File | ForEach-Object { Write-Host $_.FullName }
            throw "FAILED: generated package is framework-dependent; no bundled .NET runtime found."
          }
          Write-Host "Bundled .NET runtime files:"
          $runtimeFiles | ForEach-Object { Write-Host $_.FullName }

      - name: Run Windows App Certification Kit
        if: ${{ inputs.run_audit }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $appcertCandidates = @(
            "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit\appcert.exe",
            "${env:ProgramFiles}\Windows Kits\10\App Certification Kit\appcert.exe"
          )
          $appcert = $appcertCandidates |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $appcert) { throw "WACK failed: appcert.exe was not found on the runner." }

          $package = Get-ChildItem -Path "AppxOutput" -File |
            Where-Object { $_.Extension -in ".appx", ".appxbundle", ".msix", ".msixbundle" } |
            Select-Object -First 1
          if (-not $package) { throw "WACK failed: package not found in AppxOutput." }

          $report = Join-Path $env:GITHUB_WORKSPACE "AppxOutput\wack-report.xml"
          & $appcert reset
          if ($LASTEXITCODE -ne 0) { throw "WACK reset failed with exit code $LASTEXITCODE." }
          & $appcert test -appxpackagepath $package.FullName -reportoutputpath $report
          if ($LASTEXITCODE -ne 0) { throw "WACK failed with exit code $LASTEXITCODE." }
          if (-not (Test-Path $report)) { throw "WACK failed: no report was produced." }
          Write-Host "WACK passed: $report"

      - name: Audit packaged AppX
        if: ${{ inputs.run_audit }}
        shell: pwsh
        env:
          AUDIT_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $files = Get-ChildItem -Path "AppxOutput" -Recurse -File
          $package = $files |
            Where-Object { $_.Name -like "JellyfinXbox_*" -and $_.Extension -in ".appx", ".appxbundle", ".msix", ".msixbundle" } |
            Select-Object -First 1
          if (-not $package) { throw "Audit failed: JellyfinXbox package not found in AppxOutput." }

          $certificate = $files | Where-Object { $_.Name -eq "JellyfinXbox.cer" } | Select-Object -First 1
          if (-not $certificate) { throw "Audit failed: matching JellyfinXbox.cer not found in AppxOutput." }

          $expanded = Join-Path $env:RUNNER_TEMP "audit-expanded-package"
          if (Test-Path $expanded) { Remove-Item $expanded -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $expanded | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP "audit-package.zip"
          Copy-Item $package.FullName $archive -Force
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded -Force

          $manifestPath = Join-Path $expanded "AppxManifest.xml"
          if (-not (Test-Path $manifestPath)) { throw "Audit failed: AppxManifest.xml not found in package." }
          [xml]$manifest = Get-Content -Raw $manifestPath
          $identity = Select-Xml -Xml $manifest -XPath "/*[local-name()='Package']/*[local-name()='Identity']"
          if ($identity.Node.ProcessorArchitecture -ne "x64") {
            throw "Audit failed: package architecture is '$($identity.Node.ProcessorArchitecture)', expected x64."
          }

          $runtimeNames = @("coreclr.dll", "hostfxr.dll", "System.Private.CoreLib.dll")
          $runtimeFiles = Get-ChildItem $expanded -Recurse -File |
            Where-Object { $runtimeNames -contains $_.Name }
          if (-not $runtimeFiles) { throw "Audit failed: self-contained .NET runtime files are missing." }

          $packageHash = (Get-FileHash $package.FullName -Algorithm SHA256).Hash
          $root = (Resolve-Path "AppxOutput").Path
          $hashLines = foreach ($file in $files) {
            $relative = $file.FullName.Substring($root.Length + 1)
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash
            "$hash  $relative"
          }
          $hashLines | Set-Content -Path "AppxOutput\SHA256SUMS.txt" -Encoding utf8

          @"
          # XboxJellyfish audit report

          - Commit: $env:AUDIT_COMMIT
          - Package: $($package.Name)
          - Package SHA-256: $packageHash
          - Architecture: $($identity.Node.ProcessorArchitecture)
          - Matching certificate: $($certificate.Name)
          - Self-contained runtime: PASS
          - Client tests: PASS (completed by the preceding build step)
          - Windows App Certification Kit: PASS

          This is an automated GitHub Actions package audit. It does not replace installation and manual validation on Xbox hardware.
          "@ | Set-Content -Path "AppxOutput\audit-report.md" -Encoding utf8

          Write-Host "Audit passed for $($package.Name)"

      - name: Upload AppX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name || 'jellyfinxbox-appx' }}
          path: AppxOutput/
          if-no-files-found: error
